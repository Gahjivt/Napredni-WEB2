<h2>O aplikaciji</h2>
<p>Aplikacija namjerno sadrži dvije ranjivosti. Svaka se uključuje i isključuje potvrdnim okvirom iznad.</p>
<ul>
  <li><b>Stored XSS</b>: knjiga gostiju.</li>
  <li><b>Broken Access Control</b>: admin panel (<code>/admin</code>), kontrola pristupa temelji se na kolačiću <code>role</code>.</li>
</ul>
<p>Svatko tko otvori stranicu dobiva kolačić <code>role=user</code>.</p>
