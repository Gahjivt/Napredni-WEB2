<h2>Ostavite recenziju za artikl</h2>
{{messages}}
<form method="POST" action="/recenzija">
  <p><input name="message" size="60" maxlength="500" placeholder="Poruka" required></p>
  <button>Objavi recenziju</button>
</form>
<form method="POST" action="/recenzija/clear">
  <p><button>Obriši sve recenzije</button></p>
</form>
