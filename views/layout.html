<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <title>Demo ranjivosti</title>
</head>
<body>
  <h1>Demo ranjivosti</h1>
  <p>Vaš kolačić: <b>role={{role}}</b></p>
  <p><a href="/">Početna</a> | <a href="/guestbook">Knjiga gostiju</a> | <a href="/admin">Admin panel</a></p>

  <form method="POST" action="/settings">
    <p>
      <label><input type="checkbox" name="xss" {{xssChecked}} onchange="this.form.submit()"> XSS ranjivost UKLJUČENA</label><br>
      <label><input type="checkbox" name="access" {{accessChecked}} onchange="this.form.submit()"> Broken Access Control ranjivost UKLJUČENA</label>
    </p>
  </form>

  <form method="POST" action="/role">
    <p>Postavi kolačić: <button name="role" value="user">role=user</button> <button name="role" value="admin">role=admin</button></p>
  </form>
  <hr>
  {{content}}
</body>
</html>
