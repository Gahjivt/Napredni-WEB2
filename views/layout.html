<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <title>Demo ranjivosti</title>
</head>
<body>
  <h1>Napredni WEB labos 2</h1>
  <p>Vaš kolačić <code>token</code> (JWT): <code style="word-break: break-all">{{token}}</code><br>Uloga koju poslužitelj priznaje: <b>{{role}}</b></p>
  <p><a href="/">Početna</a> | <a href="/recenzija">Recenzije artikla</a> | <a href="/admin">Admin panel</a></p>

  <form method="POST" action="/settings">
    <p>
      <label><input type="checkbox" name="xss" {{xssChecked}} onchange="this.form.submit()"> XSS ranjivost UKLJUČENA</label><br>
      <label><input type="checkbox" name="access" {{accessChecked}} onchange="this.form.submit()"> Broken Access Control ranjivost UKLJUČENA</label>
    </p>
  </form>

  <form method="POST" action="/role">
    <p>Simulacija prijave (poslužitelj izdaje ispravno potpisan token): <button name="role" value="user">user</button> <button name="role" value="admin">admin</button></p>
  </form>
  <hr>
  {{content}}
</body>
</html>
